<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/favicon.ico?v=5" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico?v=5" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png?v=5">
    <title>老干妈</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 400px;
            max-width: 80vw;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            line-height: 2;
        }

        .videos {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        iframe {
            width: 560px;
            height: 315px;
            max-width: 90vw;
        }
    </style>
</head>

<body>
    <div class="container">

        <img
            src="/laoganma.jpg"
            alt="Lao Gan Ma logo"
            class="logo"
        >

        <h1>我很喜欢老干妈</h1>
        <h1>非常好的chili sauce</h1>
        <h1>Embrace中国文化</h1>
        <h1>不是广告 老干妈和我没有关系</h1>

        <div class="videos">

            <iframe
                src="https://www.youtube.com/embed/LNuwgbxQe-M&start=13"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
            ></iframe>
<!--
            <iframe
                src="https://www.youtube.com/embed/HWQqabCkAjU"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
            ></iframe>
-->
        </div>

    </div>
</body>
</html>
